<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voter UI</title>
  <link href="./output.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1" type="module"></script>
  
  </head>
</head>
<body>

<!-- Header -->
<header class="bg-blue-900 text-white shadow-lg relative">
  <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">

    <h1 class="text-lg md:text-2xl font-bold">
      AFRICAN PLAN FOUNDATION
    </h1>

    <!-- Desktop Menu -->
    <nav class="hidden md:block">
      <ul class="flex gap-8">
        <li><a href="#">Home</a></li>
        <li><a href="#">Vote</a></li>
        <li><a href="#">Results</a></li>
      </ul>
    </nav>

    <!-- Mobile Button -->
    <button
      type="button"
      command="--toggle"
      commandfor="mobile-menu"
      class="md:hidden p-2">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        class="size-7 in-aria-expanded:hidden">
        <path
          d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        class="size-7 not-in-aria-expanded:hidden"
      >
        <path
          d="M6 18L18 6M6 6l12 12"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>

  </div>
</header>

<!-- Mobile Menu DropDown -->
<el-disclosure
    id="mobile-menu"
    hidden
    class="md:hidden bg-blue-900 text-white">

    <a class="block px-5 py-4 text-gray-900 hover:bg-gray-100" href="#">
        Home
    </a>

    <a class="block px-5 py-4 text-gray-900 hover:bg-gray-100" href="#">
        Vote
    </a>

    <a class="block px-5 py-4 text-gray-900 hover:bg-gray-100" href="#">
        Results
    </a>

</el-disclosure>

  <!-- Main -->
  <main class="flex-1 max-w-7xl mx-auto w-full px-4 py-10">

    <!-- Voting Card -->
    <div class="max-w-lg mx-auto bg-white rounded-xl shadow-lg p-8">

      <h2 class="text-2xl font-bold text-center text-blue-900 mb-2">
        Cast Your Vote
      </h2>

      <p class="text-center text-gray-600 mb-8">
        Total Registered Voters:
        <span class="font-bold text-blue-900">20</span>
      </p>

      <form class="space-y-5">

        <div>
          <label class="block mb-2 font-medium">
            Full Name
          </label>

          <input
            type="text"
            placeholder="Enter your full name"
            class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-blue-700 outline-none"
          />
        </div>

        <div>
          <label class="block mb-2 font-medium">
            Select Candidate
          </label>

          <select
            class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-blue-700 outline-none"
          >
            <option selected disabled>Select Candidate</option>
            <option>Kosisochukwu</option>
            <option>Austin</option>
          </select>
        </div>

        <button
          type="submit"
          class="w-full bg-blue-900 hover:bg-blue-800 text-white py-3 rounded-lg font-semibold transition">
          Submit Vote
        </button>

      </form>

    </div>

    <!-- Bottom Section -->
    <div class="mt-12 flex flex-col md:flex-row justify-between gap-6">

      <!-- Winner Button -->
      <div class="flex items-end">
        <button
          command="show-modal"
          commandfor="winner-dialog"
          class="bg-green-700 hover:bg-green-800 text-white px-6 py-3 rounded-lg font-semibold shadow">
          View the Winner
        </button>
      </div>

      <!-- Vote Count Block-->
      <div class="bg-white shadow-lg rounded-xl p-6 w-full md:w-80">

        <h3 class="text-xl font-bold mb-4 text-blue-900">
          Vote Count
        </h3>

        <div class="space-y-3">

          <div class="flex justify-between">
            <span>Kosisochukwu</span>
            <span id="candidate1">0</span>
          </div>

          <div class="flex justify-between">
            <span>Austin</span>
            <span id="candidate2">0</span>
          </div>

        </div>

      </div>

    </div>

  </main>

  <!-- Footer -->
  <footer class="bg-blue-900 text-white text-center py-4 mt-10">
    © 2026 African Plan Foundation. All Rights Reserved.
  </footer>

  <!-- Winner Modal -->
  <el-dialog>
    <dialog
        id="winner-dialog"
        aria-labelledby="winner-title"
        class="fixed inset-0 size-auto max-h-none max-w-none overflow-y-auto bg-transparent backdrop:bg-transparent"
    >

        <!-- Backdrop -->
        <el-dialog-backdrop
            class="fixed inset-0 bg-black/60 transition-opacity
                   data-closed:opacity-0
                   data-enter:duration-300
                   data-enter:ease-out
                   data-leave:duration-200
                   data-leave:ease-in">
        </el-dialog-backdrop>

        <!-- Modal -->
        <div
            tabindex="0"
            class="flex min-h-full items-center justify-center p-4 focus:outline-none"
        >

            <el-dialog-panel
                class="relative w-full max-w-md overflow-hidden rounded-xl bg-white shadow-2xl transition-all
                       data-closed:translate-y-4
                       data-closed:opacity-0
                       data-enter:duration-300
                       data-enter:ease-out
                       data-leave:duration-200
                       data-leave:ease-in
                       data-closed:sm:scale-95"
            >

                <!-- Header -->
                <div class="bg-blue-900 px-6 py-4">

                    <h2
                        id="winner-title"
                        class="text-xl font-bold text-white"
                    >
                        🏆 Election Winner
                    </h2>

                </div>

                <!-- Body -->
                <div class="px-6 py-6">

                    <p class="text-gray-600 text-center">
                        The winner of the election is
                    </p>

                    <h3
                        id="winnerName"
                        class="mt-4 text-center text-3xl font-bold text-green-700"
                    >
                        Kosisochukwu
                    </h3>

                    <p class="mt-2 text-center text-gray-500">
                        Total Votes:
                        <span id="winnerVotes" class="font-semibold">
                            15
                        </span>
                    </p>

                </div>

                <!-- Footer -->
                <div class="bg-gray-100 px-6 py-4 flex justify-end">

                    <button
                        command="close"
                        commandfor="winner-dialog"
                        class="rounded-md bg-blue-900 px-5 py-2 font-semibold text-white hover:bg-blue-800"
                    >
                        Close
                    </button>

                </div>

            </el-dialog-panel>

        </div>

    </dialog>
</el-dialog>

</body>
</html>
